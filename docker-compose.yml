services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrchat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hrchat}"]
      interval: 5s
      timeout: 10s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    command: ["bash", "-lc", "python scripts/wait_for_db.py && python scripts/migrate.py && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    # Tests use their own database and a scripted LLM, so they never touch demo data or need an API key.
    environment:
      DATABASE_URL: postgresql://app_user:app_pass@db:5432/hrchat_test
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/hrchat_test
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]
    command: ["bash", "-lc", "python scripts/wait_for_db.py && python scripts/migrate.py && python scripts/seed.py --reset && pytest -q"]

volumes:
  db_data:
